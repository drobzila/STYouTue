name: Render Quran Video & Upload to Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1️⃣ تثبيت الحزم والاعتماديات الأساسية لنظام التشغيل وسيرفر الصوت والفيديو والأتمتة
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg build-essential libcairo2-dev libpango1.0-dev freeglut3-dev pkg-config rclone

    # 2️⃣ تثبيت وتفعيل الخط المرفوع في مستودعك داخل نظام السيرفر لضمان ظهور النصوص العربية بشكل صحيح
    - name: Set up Custom Fonts
      run: |
        sudo mkdir -p /usr/local/share/fonts/truetype/custom
        sudo cp fonts/*.ttf /usr/local/share/fonts/truetype/custom/ || true
        sudo fc-cache -fv

    # 3️⃣ إعداد بيئة بايثون الاصدار المستقر لـ Manim
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 4️⃣ تثبيت مكتبات بايثون المذكورة في ملف requirements.txt
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5️⃣ تشغيل الرندرة بأعلى جودة High Quality (1080p) وطباعة هيكلة الملفات الناتجة
    - name: Render Video via Manim
      run: |
        manim --quality h -a quiz.py Quran
        echo "=== طباعة المجلدات الناتجة للتأكد من مكان الفيديو ==="
        ls -R media/ || echo "مجلد media غير موجود!"

    # 6️⃣ خطوة احتياطية: حفظ الفيديو داخل GitHub Actions لتتمكن من تحميله يدوياً بضغطة زر لو احتجت
    - name: Upload Video as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: quran-video-output
        path: media/videos/
        if-no-files-found: warn

    # 7️⃣ خطوة الرفع الذكية والمضمونة إلى حسابك في Google Drive
    - name: Configure Rclone & Upload to Google Drive
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        FOLDER_ID: "1Tbkse12zzosT83VwrkwRa4pn5t0yhUdw" 
      run: |
        mkdir -p ~/.config/rclone
        # كتابة النص المشفر الخاص بـ Rclone داخل السيرفر
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        
        # استخراج اسم الريموت ديناميكياً لتجنب خطأ التسمية (drive أو gdrive)
        REMOTE_NAME=$(grep -oP '\[\K[^\]]+' ~/.config/rclone/rclone.conf | head -n 1)
        
        echo "[*] Detected remote name: $REMOTE_NAME"
        echo "[*] Destination Folder ID: $FOLDER_ID"
        echo "[*] Uploading everything inside videos folder to Google Drive..."
        
        # رفع مجلد الفيديوهات بالكامل لضمان العثور على الفيديو مهما كان مساره
        rclone copy media/videos/ ${REMOTE_NAME}:${FOLDER_ID} --progress
