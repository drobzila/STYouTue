name: Render Quran Video & Upload to Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg build-essential libcairo2-dev libpango1.0-dev freeglut3-dev pkg-config fonts-amiri fonts-sil-charis rclone

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Render Video via Manim
      run: |
        manim -pgh -a quiz.py Quran

    # 💡 خطوة الرفع المحدثة والمستقرة باستخدام Rclone
    - name: Configure Rclone & Upload to Google Drive
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        FOLDER_ID: "1Tbkse12zzosT83VwrkwRa4pn5t0yhUdw"  # استبدل هذا المعرف بمعرف مجلدك في الدرايف
      run: |
        # إعداد ملف التهيئة لـ rclone بشكل ديناميكي وآمن
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        
        # نلاحظ هنا تغير المسار إلى 1080p30 تلقائياً بسبب جودة الجرافيكس المرتفعة
        rclone copy media/videos/quiz/1080p30/Quran.mp4 gdrive:$FOLDER_ID --progress
