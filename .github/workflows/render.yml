name: Render Quran Video & Upload to Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # تثبيت الحزم والاعتماديات الأساسية
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg build-essential libcairo2-dev libpango1.0-dev freeglut3-dev pkg-config rclone

    # تثبيت وتفعيل الخط المرفوع في المستودع
    - name: Set up Custom Fonts
      run: |
        sudo mkdir -p /usr/local/share/fonts/truetype/custom
        sudo cp fonts/*.ttf /usr/local/share/fonts/truetype/custom/
        sudo fc-cache -fv

    # إعداد بيئة بايثون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # تثبيت مكتبات بايثون المذكورة في requirements.txt
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # تشغيل الرندرة، ثم البحث عن ملف الـ mp4 الناتج ونقله فوراً للمجلد الرئيسي لتسهيل الوصول إليه
    - name: Render Video via Manim
      run: |
        manim --quality h -a -o final_video.mp4 quiz.py Quran
        
        # أمر ذكي للبحث عن الفيديو بنسق mp4 ونقله للمجلد الحالي باسم quran_video.mp4 مهما كان عمق المجلدات
        find media/ -name "final_video.mp4" -exec mv {} ./quran_video.mp4 \;
        
        # التأكد من أن الملف أصبح في المجلد الرئيسي عبر طباعة قائمة الملفات
        ls -la

    # خطوة الرفع المباشرة لملف قورآن المتموضع في المجلد الرئيسي
    - name: Configure Rclone & Upload to Google Drive
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        FOLDER_ID: "1Tbkse12zzosT83VwrkwRa4pn5t0yhUdw" 
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        
        REMOTE_NAME=$(grep -oP '\[\K[^\]]+' ~/.config/rclone/rclone.conf | head -n 1)
        
        echo "[*] Detected remote name: $REMOTE_NAME"
        echo "[*] Uploading video file directly to Google Drive..."
        
        # استخدام copyto لرفع ملف فردي محدد ومباشر دون الحاجة لقراءة المجلدات الجانبية
        rclone copyto ./quran_video.mp4 ${REMOTE_NAME}:${FOLDER_ID}/quran_video.mp4 --progress
