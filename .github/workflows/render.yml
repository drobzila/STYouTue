name: Render Quran Video & Upload to Drive

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render_and_upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # تم إزالة fonts-amiri واستبدالها بإعداد الخطوط المحلي
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg build-essential libcairo2-dev libpango1.0-dev freeglut3-dev pkg-config rclone

    # تثبيت وتفعيل الخط المرفوع في المستودع داخل نظام السيرفر
    - name: Set up Custom Fonts
      run: |
        sudo mkdir -p /usr/local/share/fonts/truetype/custom
        sudo cp fonts/*.ttf /usr/local/share/fonts/truetype/custom/
        sudo fc-cache -fv

     Sir configuration for Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # تشغيل الرندرة بأعلى جودة High Quality (1080p)
    - name: Render Video via Manim
      run: |
        manim -pgh -a quiz.py Quran

    # خطوة الرفع المباشرة والآمنة للدرايف
    - name: Configure Rclone & Upload to Google Drive
      env:
        RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        FOLDER_ID: "ضع_هنا_معرف_مجلدك" 
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
        rclone copy media/videos/quiz/1080p30/Quran.mp4 gdrive:$FOLDER_ID --progress
